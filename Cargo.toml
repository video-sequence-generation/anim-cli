[package]
name = "anim-cli"
version = "0.1.0"
edition = "2021"
description = "Lightweight Animation CLI - Convert natural language prompts to 60 FPS MP4 videos using HyperFrames + LLMs"
license = "MIT"
repository = "https://github.com/video-sequence-generation/anim-cli"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
ureq = { version = "2.10", features = ["json", "tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
which = "6.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"